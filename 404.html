<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>페이지를 찾을 수 없어요 · 누비 스튜디오</title>
<!--
  2026-08-05 신설. 종전에는 Vercel 기본 화면("The page could not be found / NOT_FOUND")이 떴다 —
  브랜드도, 홈으로 가는 길도, 예약 경로도 없어서 잘못된 링크로 들어온 사람은 그대로 이탈했다.
  Checklist Design 「404 Website」 5항목(로고·타이틀·설명·다른 페이지 링크·브랜드 개성)을 그대로 채운다.

  ⚠️ 의도적으로 self-contained 다 — styles.css + site.js 에 의존하면 테마 토글 JS 가 없는 이 페이지에서
     라이트/다크가 어긋난다. 토큰 값은 styles.css 와 같은 것을 쓰되 prefers-color-scheme 으로만 분기한다.
  ⚠️ 톤 = 정직·담백. "앗! 길을 잃으셨나요?" 류의 들뜬 문구는 우리 보이스가 아니다.
-->
<style>
  *{box-sizing:border-box}
  :root{
    --bg:#FFFFFF; --ink:#181818; --dim:#5E5E61; --faint:#6E6E72; --line:#E3E3E6;
    --btnBg:#181818; --btnFg:#FFFFFF;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0B0B0C; --ink:#F5F5F6; --dim:#A8A8AC; --faint:#7F7F84; --line:#2B2B2E;
           --btnBg:#F5F5F6; --btnFg:#0B0B0C; }
  }
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Pretendard","Noto Sans KR",-apple-system,BlinkMacSystemFont,sans-serif;line-height:1.7}
  .wrap{max-width:640px;margin:0 auto;padding:72px 24px 96px;min-height:100vh;display:flex;flex-direction:column}
  .logo{font-weight:700;font-size:22px;letter-spacing:.16em;line-height:1;text-decoration:none;color:var(--ink)}
  .logosub{font-size:12px;letter-spacing:.02em;color:var(--dim);margin-top:6px}
  .code{font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:var(--faint);margin:64px 0 12px}
  h1{font-size:clamp(28px,7vw,40px);font-weight:700;letter-spacing:-.02em;line-height:1.2;margin:0}
  p{color:var(--dim);font-size:15.5px;margin:18px 0 0}
  .links{display:flex;flex-direction:column;gap:10px;margin-top:36px}
  /* 체크리스트 「Order your contact options by accessibility」 — 쉬운 것부터 위로.
     ① 홈(가장 쉬움) ② 룸별 페이지 ③ 예약·문의(외부 이동) 순. */
  .links a{display:flex;align-items:center;justify-content:space-between;gap:12px;
    min-height:56px;padding:14px 18px;border:1px solid var(--line);border-radius:2px;
    color:var(--ink);text-decoration:none;font-size:15px;font-weight:500;
    transition:border-color .2s ease,transform .15s ease}
  .links a:hover{border-color:var(--ink)}
  .links a:active{transform:scale(.99)}
  .links a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .links a.primary{background:var(--btnBg);color:var(--btnFg);border-color:var(--btnBg)}
  .links a .arrow{color:inherit;opacity:.6}
  .foot{margin-top:auto;padding-top:56px;border-top:1px solid var(--line);
    color:var(--faint);font-size:13px;line-height:1.9}
  .foot a{color:var(--dim)}
</style>
</head>
<body>
  <div class="wrap">
    <!-- ① 로고 -->
    <div>
      <a class="logo" href="/">NUVIE</a>
      <div class="logosub">누비 스튜디오</div>
    </div>

    <!-- ② 타이틀 · ③ 설명 -->
    <div class="code">404</div>
    <h1>페이지를 찾을 수 없어요</h1>
    <p>주소가 바뀌었거나, 링크가 잘못됐을 수 있어요.<br>아래에서 찾으시는 곳으로 바로 가실 수 있습니다.</p>

    <!-- ④ 다른 페이지로 가는 길 -->
    <nav class="links">
      <a class="primary" href="/">누비 스튜디오 홈 <span class="arrow">&rarr;</span></a>
      <a href="/a">A룸 · 동양풍 &amp; 블랙 호리존 <span class="arrow">&rarr;</span></a>
      <a href="/b">B룸 · 화이트 티타임 카페 <span class="arrow">&rarr;</span></a>
      <a href="/#faq">자주 묻는 질문 <span class="arrow">&rarr;</span></a>
    </nav>

    <!-- ⑤ 브랜드 개성 = 우리 경우엔 장식이 아니라 «여백과 담백한 사실». 푸터 문구는 전 페이지 공통 규격. -->
    <div class="foot">
      📍 서울 강서구 까치산역 도보 10분 / 예약·문의: 아워플레이스<br>
      <a href="/privacy.html">개인정보처리방침</a>
    </div>
  </div>
</body>
</html>
