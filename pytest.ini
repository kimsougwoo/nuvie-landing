; 랜딩 폴더 전용 pytest 설정(2026-10-01).
; 이 파일이 없으면 홈 C:\Users\kgr96\pytest.ini 가 위에서 잡혀(rootdir = 홈, norecursedirs 에 «.*» 없음)
; .vercel/output/static 의 테스트 복사본까지 수집하고 이름이 겹쳐 수집 오류가 난다. 계약 = test_pytest_ini_1001.py
; JS 테스트(test_*.js)는 node 로 따로 돌린다. 배포에는 싣지 않는다(.vercelignore).
[pytest]
testpaths = .
norecursedirs = .* __pycache__ node_modules
